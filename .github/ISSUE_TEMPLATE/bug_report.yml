name: Bug report
description: Report reproducible pkx behavior (not a public security issue).
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Thanks for improving pkx! For security vulnerabilities, follow SECURITY.md. Redact secrets, usernames, paths and tokens."
  - type: input
    id: version
    attributes:
      label: pkx version
      description: Output of `pkx version`.
      placeholder: 0.4.0-dev
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: pkx plan --dir ./my-project
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Share minimal manifest or lockfile details when relevant.
      placeholder: "1. Create a minimal package.json ...\n2. Run pkx ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
      render: text
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and removed sensitive information.
          required: true
