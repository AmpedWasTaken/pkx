name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal scripts)"
          if [ -n "$unformatted" ]; then
            echo "Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check Markdown links and SVG assets
        run: go run ./scripts/check-docs.go
      - name: Verify hosted installer sources
        shell: bash
        run: |
          cmp -s scripts/install.ps1 site/install.ps1 || { echo "site/install.ps1 must match scripts/install.ps1"; exit 1; }
          cmp -s scripts/install.sh site/install.sh || { echo "site/install.sh must match scripts/install.sh"; exit 1; }
          sh -n site/install.sh
          sh site/install.sh --help
      - name: Verify Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n scripts/install.sh
          sh scripts/install.sh --help
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $usage = & .\scripts\install.ps1 -Help | Out-String
          if ($usage -notmatch 'AddToPath' -or $usage -notmatch 'NEW CMD') {
            throw 'Windows installer must explain user PATH opt-in and terminal restart'
          }
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/pkx
      - name: Native npm CLI smoke
        shell: bash
        run: bash scripts/smoke.sh
      - name: Verify release packages (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/package-release.sh 0.5.0
      - name: Race tests (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...
