name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: |
          test -z "$(gofmt -l cmd internal)"
      - name: Verify Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n scripts/install.sh
          sh scripts/install.sh --help
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install.ps1 -Help
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/pkx
      - name: Race tests (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...
