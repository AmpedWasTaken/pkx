name: One-time Go formatting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gofmt-once.yml

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format and test
        run: |
          gofmt -w cmd/pkx internal/pkx
          go test ./...
          go vet ./...
      - name: Commit formatted sources
        run: |
          if git diff --quiet -- cmd/pkx internal/pkx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/pkx internal/pkx
          git commit -m "style(go): format CLI and tests with gofmt"
          git push origin HEAD:main
