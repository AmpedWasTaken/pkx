<g>
<rect x="30" y="424" width="940" height="64" rx="13" fill="#182338" stroke="#34425c"/>
<rect x="43" y="435" width="92" height="42" rx="9" fill="#E4C177" fill-opacity=".14"/>
<text x="89" y="461" text-anchor="middle" font-size="14" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#E4C177">RFC</text>
<text x="157" y="449" font-size="18" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#F0F5FF">Runtime bootstrap</text>
<text x="157" y="471" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#A8B8CF">Preview, consent, verification, then opt-in install</text>
<rect x="829" y="441" width="116" height="29" rx="14" fill="#E4C177" fill-opacity=".14"/>
<text x="887" y="460" text-anchor="middle" font-size="12" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#E4C177">DESIGN</text>
