<text x="89" y="387" text-anchor="middle" font-size="14" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#E4C177">RFC</text>
<text x="157" y="375" font-size="18" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#F0F5FF">Remote bundle exchange</text>
<text x="157" y="397" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#A8B8CF">Trusted catalog metadata and opt-in bundle fetching</text>
<rect x="829" y="367" width="116" height="29" rx="14" fill="#E4C177" fill-opacity=".14"/>
<text x="887" y="386" text-anchor="middle" font-size="12" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#E4C177">DESIGN</text>
